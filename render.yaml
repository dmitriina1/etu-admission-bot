services:
  - type: web
    name: etu-admission-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn bot:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_CHAT_ID
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: etu-admission-db
          property: connectionString
      - key: APPLICANT_CODE
        value: "1203485"
      - key: FORECAST_SIMULATIONS
        value: "300000"
      - key: FORECAST_LIST
        value: "2"
      - key: SEED
        value: "20260723"

databases:
  - name: etu-admission-db
    plan: free
    databaseName: etu_admission
    user: etu_admission
